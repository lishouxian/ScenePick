name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: Build macOS app
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Test
        run: make test

      - name: Package
        env:
          APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '1.0.0' }}
          APP_BUILD: ${{ github.run_number }}
        run: |
          if [[ "$APP_VERSION" == v* ]]; then
            APP_VERSION="${APP_VERSION#v}"
          fi
          export APP_VERSION APP_BUILD
          make dist

      - name: Verify release checksums
        run: |
          cd Dist
          shasum -a 256 -c SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ScenePick-macos
          path: |
            Dist/ScenePick.dmg
            Dist/ScenePick.zip
            Dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            Dist/ScenePick.dmg \
            Dist/ScenePick.zip \
            Dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "ScenePick $GITHUB_REF_NAME" \
            --notes "Automated macOS release for $GITHUB_REF_NAME." \
            --verify-tag

  cask-lint:
    name: Lint Homebrew cask
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Ruby syntax
        run: ruby -c Casks/scene-pick.rb

      - name: Run brew style
        run: brew style Casks/scene-pick.rb
